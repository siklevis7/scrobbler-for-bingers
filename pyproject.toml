[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bingers-scrobbler"
version = "0.4.0"
description = "Automatically mark what you watch in local media players as watched on Bingers."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "guessit>=3.8",
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
bingers-scrobbler = "bingers_scrobbler.cli:main"

[project.gui-scripts]
bingers-scrobbler-tray = "bingers_scrobbler.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bingers_scrobbler = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
