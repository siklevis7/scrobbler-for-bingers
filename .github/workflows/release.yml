name: Build Windows app

# Push a tag like v0.2.0 to build the installer and publish a GitHub release.
# "Run workflow" on the Actions tab builds the files without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Test
        run: pytest -q

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import bingers_scrobbler; print(bingers_scrobbler.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match __version__ $version"; exit 1
          }

      - name: Build the app with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/bingers-scrobbler.spec

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist/BingersScrobbler/BingersScrobbler.exe -ArgumentList "--self-test", "$PWD\selftest.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test exit code $($p.ExitCode)"; exit 1 }
          Get-Content selftest.json

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = python -c "import bingers_scrobbler; print(bingers_scrobbler.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/BingersScrobbler/* -DestinationPath "dist/BingersScrobbler_Portable_$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/BingersScrobbler_Setup_*.exe
            dist/BingersScrobbler_Portable_*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BingersScrobbler_Setup_*.exe
            dist/BingersScrobbler_Portable_*.zip
          generate_release_notes: true
